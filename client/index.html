<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock · Paper · Scissors: Formations</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #1a1a2e; overflow: hidden; user-select: none; }
      /* touch-action: none tells the browser to hand all touch events to JS */
      canvas { display: block; touch-action: none; }

      #menu {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: #1a1a2e;
        z-index: 20;
      }

      #menu h1 {
        font-family: monospace;
        font-size: 2rem;
        color: #e0e0ff;
        letter-spacing: 0.05em;
        text-align: center;
      }

      #menu p {
        font-family: monospace;
        font-size: 0.85rem;
        color: #888;
        text-align: center;
      }

      #menu button {
        font-family: monospace;
        font-size: 1.1rem;
        padding: 0.75rem 2.5rem;
        border: 2px solid #5a5aaa;
        border-radius: 6px;
        background: #24244a;
        color: #c8c8ff;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
        width: 220px;
      }

      #menu button:hover {
        background: #32328a;
        border-color: #9090ff;
      }
    </style>
  </head>
  <body>
    <div id="menu">
      <h1>Rock · Paper · Scissors<br>Formations</h1>
      <button id="btn-practice">Practice (Local)</button>
      <button id="btn-online">Find Match (Online)</button>
      <p>Z/X/C spawn · F form · U upgrade · Right-click or tap-to-move</p>
      <p>Touch: 1 finger select/move · 2 fingers pan/zoom</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
